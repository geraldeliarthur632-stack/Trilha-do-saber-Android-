name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Preparar Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L \
              -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Corrigir recursos Android
        working-directory: android
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/values/missing_strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="competition_title">Competição</string>
              <string name="competition_setup_title">Preparar competição</string>
              <string name="competition_setup_subtitle">Adicione os jogadores</string>
              <string name="label_player_name">Nome do jogador</string>
              <string name="btn_add_player">Adicionar jogador</string>
              <string name="btn_start_competition">Começar competição</string>
              <string name="competition_result_title">Resultado</string>
              <string name="profile_title">Perfil</string>
              <string name="profile_xp_total">XP total</string>
              <string name="profile_coins_total">Moedas</string>
              <string name="profile_completed">Atividades concluídas</string>
              <string name="profile_correct_answers">Respostas corretas</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_book.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M18,2H6C4.9,2 4,2.9 4,4v16c0,1.1 0.9,2 2,2h12v-2H6V4h12v16h2V4c0,-1.1 -0.9,-2 -2,-2zM8,6h8v2H8V6zM8,10h8v2H8v-2z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/bg_option_selected.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#E3F2FD"/>
              <corners android:radius="12dp"/>
              <stroke
                  android:width="2dp"
                  android:color="#2196F3"/>
          </shape>
          EOF

      - name: Remover package antigo do Manifest
        working-directory: android
        run: |
          sed -i 's/package="com.trilhadosaber.app"//' app/src/main/AndroidManifest.xml

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Trilha-do-Saber-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk